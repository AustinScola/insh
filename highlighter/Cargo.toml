[package]
name = "highlighter"
version = "0.1.0"
edition = "2021"

[features]
# Explicitly, the default features are none.
default = []

# Lets what each piece of some code is be sent somewhere else and read back, which is what the
# daemon telling a client how to color a file it is editing needs.
serde = ["dep:serde"]

[dependencies]
# Used for sending what each piece of some code is somewhere else. (Only included if the serde
# feature is enabled.)
serde = { workspace = true, optional = true }

# Used to parse code, and to keep it parsed as it changes so that only what changed is parsed
# again.
tree-sitter = { workspace = true }

# The grammars for the languages which can be highlighted.
tree-sitter-bash = { workspace = true }
tree-sitter-c = { workspace = true }
tree-sitter-go = { workspace = true }
tree-sitter-javascript = { workspace = true }
tree-sitter-json = { workspace = true }
tree-sitter-python = { workspace = true }
tree-sitter-rust = { workspace = true }
tree-sitter-sequel = { workspace = true }
tree-sitter-toml-ng = { workspace = true }
tree-sitter-yaml = { workspace = true }

[dev-dependencies]
# Used for parameterizing tests.
test-case = { workspace = true }
