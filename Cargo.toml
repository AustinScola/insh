[workspace]
resolver = "2"
members = [
    "ai-client",
    "ansi",
    "embedder",
    "highlighter",
    "insh",
    "inshd",
    "common",
    "daemon",
    "insh-api",
    "insh-db",
    "inshd-client",
    "til",
    "term",
    "rend",
    "path-finder",
    "phrase-searcher",
    "size",
    "file-info",
    "file-type",
    "human-friendly",
]

[workspace.dependencies]
# Used for command line argument parsing.
clap = { version = "4.6.6", features = ["derive"] }

# Used for concurrent programming.
crossbeam = "0.8.4"

# Used for determining platform-specific directories.
dirs = "6.0.0"

# Used for logging.
log = "0.4.34"
flexi_logger = "0.31.10"

# Used for declaring lazily evaluated static values.
lazy_static = "1.5.0"

# Provides friendly bindings for *nix platform APIs.
# Used for doing things such as sending signals to processes (to stop inshd for example).
#
# NOTE: Every module is opt-in as of 0.27, so the features have to be listed explicitly. `event` is
# `sys::select`, `term` is `pty::forkpty`, and `fs` covers `chdir`/`chown`/`umask`.
nix = { version = "0.31.3", features = ["event", "fs", "poll", "process", "signal", "term", "time", "user"] }

# Used to create a parser for text with ANSI escape codes.
nom = "8.0.0"

# Used for serializing and deserializing requests and responses.
#
# NOTE: This replaced `bincode`, which is unmaintained (RUSTSEC-2025-0141).
#
# NOTE: The default features have to be off. `heapless-cas` is on by default and pulls in
# `atomic-polyfill`, which is itself unmaintained (RUSTSEC-2023-0089), so leaving the defaults
# alone just trades one `cargo audit` warning for another.
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }

# Used for pattern matching.
regex = "1.13.1"

# Used for serialization and deserialization of data structures.
serde = { version = "1.0.229", features = ["derive"] }

# Used for reading and writing YAML (the config files and inshd's persistent data).
#
# NOTE: This is a maintained fork of `serde_yaml`, which was archived upstream.
serde_yaml_ng = "0.10.0"

# Used to handle signals.
signal-hook = { version = "0.4.4", features = ["extended-siginfo"] }

# Used for generating the builder pattern for structs.
typed-builder = "0.23.2"

# Used for globally unique identifiers.
uuid = { version = "1.26.0", features = ["v4", "fast-rng", "macro-diagnostics"] }

# Used for walking directories.
walkdir = "2.5.0"

# Used for walking directories and selectively ignoring files.
ignore = "0.4.33"

# Used to make handling pipes easier.
os_pipe = "1.2.3"

# Used to manage the clipboard.
copypasta = "0.10.2"

# Used for formatting the times that files were modified in the local time zone.
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }

# Used for iterator adaptors.
itertools = "0.15.0"

# Used for splitting strings into grapheme clusters.
unicode-segmentation = "1.13.3"

# Used for working out how many columns of a terminal a character takes up.
unicode-width = "0.2.2"

# Used for declaring sets of flags.
bitflags = "2.13.1"

# Used for raw terminal control.
termios = "0.3.3"

# Used to run an embedded PostgreSQL server. The `bundled` feature embeds the PostgreSQL binaries
# in the executable so that PostgreSQL does not have to be installed separately.
postgresql_embedded = { version = "0.21.0", default-features = false, features = ["blocking", "bundled", "theseus", "tls-rustls-ring"] }

# Used to run `pg_ctl` directly in order to stop a PostgreSQL server which was left running.
postgresql_commands = "0.21.0"

# Used at build time to get the PostgreSQL headers and PGXS makefiles which pgvector is built
# against. This is the same archive that `postgresql_embedded` runs the server from.
postgresql_archive = { version = "0.21.0", default-features = false, features = ["blocking", "theseus", "tls-rustls-ring"] }

# Used as an ORM for the database.
diesel = { version = "2.3.12", features = ["postgres", "r2d2"] }

# Used to embed the database migrations in the executable and to run them.
diesel_migrations = "2.3.2"

# Not used directly. Diesel depends on this for the PostgreSQL backend, but it does not expose a
# feature to build libpq from source, so it is depended on here to enable that feature. TLS is not
# enabled because the database is only reachable over a local unix socket.
pq-sys = { version = "0.7.5", features = ["bundled_without_openssl"] }

# Used for the vector column type and the distance operators that pgvector adds.
pgvector = { version = "0.4.2", default-features = false, features = ["diesel"] }

# Used for HTTP requests to AI inference engines. This is blocking all the way down, unlike
# `reqwest`, which would run an asynchronous runtime inside inshd's threads.
ureq = { version = "3.4.1", features = ["json"] }

# Used for the JSON which AI inference engines send and receive.
serde_json = "1.0.145"

# Used to turn text into vectors. Model2Vec models are static, so embedding is a lookup and a
# pooling rather than a forward pass, which is why no inference runtime is needed.
#
# NOTE: The default features pull in `hf-hub` and with it a second major version of `ureq`. The
# model is embedded in the executable at build time, so nothing is ever downloaded at run time and
# `local-only` is what is wanted.
model2vec-rs = { version = "0.2.1", default-features = false, features = ["local-only"] }

# Not used directly. `model2vec-rs` depends on this, and `tokenizers` fails to compile unless a
# regex backend is picked. The features `model2vec-rs` exposes for that (`onig`, `fancy-regex`)
# both also turn on `esaxx_fast`, which needs a C++ compiler, so the backend is chosen here
# instead. `fancy-regex` is the one which is written in Rust.
tokenizers = { version = "0.21.4", default-features = false, features = ["fancy-regex"] }

# Used to verify the model which the build script downloads.
sha2 = "0.10.9"

# Used to highlight code by parsing it. Tree-sitter is what editors use, so the grammars are worth
# having beyond showing code in a chat.
tree-sitter-highlight = "0.27.0"

# The grammars which code is highlighted with. Each is the parser for one language, generated as C
# and built by its own build script.
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-sequel = "0.3.11"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-yaml = "0.7.2"

# Used to read the markdown which an AI inference engine replies in.
pulldown-cmark = { version = "0.13.4", default-features = false }

# Used for parameterizing tests.
test-case = "3.3.1"

# Used for benchmarking.
criterion = "0.8.2"
